

#prefix and suffix configration


#Database Configrations
spring.datasource.url=jdbc:mysql://localhost:3306/weddingplanner?createDatabaseIfNotExist=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.database-platform = org.hibernate.dialect.MySQL8Dialect
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto = update
server.port = 8081
server.servlet.session.timeout=10m
#context Path 

server.servlet.context-path=/WeddingPlanner


#URL: http://localhost:8081/WeddingPlanner/
